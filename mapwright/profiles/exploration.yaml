name: exploration
description: >-
  Loops, optional routes, and legible landmarks are the whole product. A dead
  end that pays out is fine; a space the player cannot navigate by sight is not.

thresholds:
  minimum_route_diversity: 3.0
  traversal_concentration: 45.0
  dead_end_ratio: 45.0
  chokepoint_width: 2.0
  landmark_candidate_ratio: 1.25
  landmark_hierarchy_factor: 1.8
  density_imbalance: 60.0
  empty_zone_ratio: 60.0
  max_consecutive_high: 2.0

weights:
  flow: 1.7
  visual: 1.5
  spatial: 1.3
  pacing: 1.2
  navigation: 1.1
  encounter: 0.6
  fairness: 0.2

severity_overrides:
  landmark_never_visible: ERROR
  no_landmark_hierarchy: ERROR
  low_route_diversity: ERROR
  traversal_concentration: WARNING
  dead_end: INFO
  frontal_only_engagement: INFO
