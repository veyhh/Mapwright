name: fps
description: >-
  Arena and corridor shooters. Encounters need multiple approaches, readable
  cover, and routes that do not funnel every fight through one door.

thresholds:
  traversal_concentration: 50.0
  chokepoint_width: 2.5
  minimum_route_diversity: 2.0
  minimum_encounter_entrances: 2.0
  minimum_flank_routes: 1.0
  cover_height_min: 0.8
  cover_height_max: 1.8
  high_ground_delta: 1.5
  travel_time_asymmetry: 12.0

weights:
  encounter: 1.6
  flow: 1.4
  navigation: 1.3
  fairness: 1.2
  spatial: 1.0
  pacing: 0.9
  visual: 0.8

severity_overrides:
  frontal_only_engagement: ERROR
  no_flank_route: WARNING
  no_high_ground: WARNING
  dead_end: INFO
